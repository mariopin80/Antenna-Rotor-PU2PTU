[Application]
name=Rotor PU2PTU
version=1.3.0
publisher=Mario Pin - PU2PTU
entry_point=rotor_pc:main
icon=rotor_icon.ico
console=false
extra_preamble=startup.py

[Shortcut Rotor PU2PTU - Simulacao]
entry_point=rotor_sim:main
icon=rotor_icon.ico
console=false
extra_preamble=startup.py

[Python]
version=3.12.10
bitness=64
include_msvcrt=false

[Include]
packages=rotor_pc
    rotor_geo
    rotor_map
    rotor_sim
    rotor_i18n
    rotor_windows
    tkinter
    _tkinter
local_wheels=wheels/*.whl
files=lib
    LEIA_PRIMEIRO.md
    CREDITOS.txt
    LICENSE_PYSERIAL.txt
exclude=pkgs/tkinter/test
    pkgs/**/__pycache__

[Build]
directory=build
installer_name=Rotor_PU2PTU_1.3.0_Setup_x64.exe
nsi_template=rotor.nsi
